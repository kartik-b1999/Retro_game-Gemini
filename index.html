<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ROCKET DODGE</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#0b0f1a; color:#e6f1ff; font-family:monospace; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .wrap { text-align:center; }
  h1 { font-size:22px; letter-spacing:4px; color:#7df9ff; text-shadow:0 0 10px #7df9ff; margin:10px 0; }
  canvas { background:#101828; border:4px solid #7df9ff; box-shadow:0 0 24px #7df9ff55; image-rendering:pixelated; touch-action:none; }
  p { color:#9fb3c8; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ROCKET DODGE</h1>
  <canvas id="game" width="360" height="480"></canvas>
  <p>Move: ← → / A D &nbsp;|&nbsp; Restart: Space &nbsp;|&nbsp; Drag on mobile</p>
</div>

<script>
const c = document.getElementById('game');
const x = c.getContext('2d');
const W = c.width, H = c.height;

let score = 0, best = 0, alive = true, t = 0;
const rocket = { x: W / 2 - 12, y: H - 70, w: 24, h: 34, speed: 5 };
let keys = {}, stones = [], stars = [];

for (let i = 0; i < 50; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2.5 + 0.5 });
}

addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'Space') {
    if (!alive) reset();
    e.preventDefault();
  }
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

c.addEventListener('pointermove', e => {
  const r = c.getBoundingClientRect();
  rocket.x = Math.max(0, Math.min(W - rocket.w, e.clientX - r.left - rocket.w / 2));
});

function reset() {
  score = 0;
  alive = true;
  t = 0;
  stones = [];
  rocket.x = W / 2 - 12;
}

function spawnStone() {
  const size = 16 + Math.random() * 26;
  stones.push({
    x: Math.random() * (W - size),
    y: -size,
    r: size / 2,
    vy: 2 + Math.random() * 2 + score / 250,
    spin: Math.random() * 0.1 - 0.05,
    angle: Math.random() * Math.PI * 2,
    counted: false
  });
}

function drawRocket() {
  const cx = rocket.x + rocket.w / 2;

  // Exhaust flame
  const flick = 6 + Math.random() * 8;
  x.fillStyle = '#ff9f1c';
  x.beginPath();
  x.moveTo(cx - 6, rocket.y + rocket.h);
  x.lineTo(cx + 6, rocket.y + rocket.h);
  x.lineTo(cx, rocket.y + rocket.h + flick);
  x.closePath();
  x.fill();

  x.fillStyle = '#ffd166';
  x.beginPath();
  x.moveTo(cx - 3, rocket.y + rocket.h);
  x.lineTo(cx + 3, rocket.y + rocket.h);
  x.lineTo(cx, rocket.y + rocket.h + flick * 0.6);
  x.closePath();
  x.fill();

  // Fins
  x.fillStyle = '#ff5d8f';
  x.fillRect(rocket.x - 4, rocket.y + rocket.h - 12, 6, 12);
  x.fillRect(rocket.x + rocket.w - 2, rocket.y + rocket.h - 12, 6, 12);

  // Body
  x.fillStyle = '#e6f1ff';
  x.fillRect(rocket.x, rocket.y + 10, rocket.w, rocket.h - 10);

  // Nose
  x.fillStyle = '#ff5d8f';
  x.beginPath();
  x.moveTo(cx, rocket.y);
  x.lineTo(rocket.x + rocket.w, rocket.y + 12);
  x.lineTo(rocket.x, rocket.y + 12);
  x.closePath();
  x.fill();

  // Window
  x.fillStyle = '#7df9ff';
  x.beginPath();
  x.arc(cx, rocket.y + 20, 5, 0, Math.PI * 2);
  x.fill();
}

function drawStone(s) {
  x.save();
  x.translate(s.x + s.r, s.y + s.r);
  x.rotate(s.angle);
  x.fillStyle = '#8d99ae';
  x.beginPath();
  x.moveTo(-s.r, -s.r * 0.4);
  x.lineTo(-s.r * 0.4, -s.r);
  x.lineTo(s.r * 0.6, -s.r * 0.8);
  x.lineTo(s.r, 0);
  x.lineTo(s.r * 0.5, s.r);
  x.lineTo(-s.r * 0.5, s.r * 0.8);
  x.closePath();
  x.fill();

  x.fillStyle = '#5c677d';
  x.fillRect(-s.r * 0.4, -s.r * 0.2, s.r * 0.5, s.r * 0.4);
  x.restore();
}

function circleHitsRocket(s) {
  const rx = Math.max(rocket.x, Math.min(s.x + s.r, rocket.x + rocket.w));
  const ry = Math.max(rocket.y, Math.min(s.y + s.r, rocket.y + rocket.h));
  const dx = s.x + s.r - rx;
  const dy = s.y + s.r - ry;
  return dx * dx + dy * dy < s.r * s.r;
}

function loop() {
  t++;

  if (alive) {
    if (keys['arrowleft'] || keys['a']) rocket.x -= rocket.speed;
    if (keys['arrowright'] || keys['d']) rocket.x += rocket.speed;
    rocket.x = Math.max(0, Math.min(W - rocket.w, rocket.x));

    if (t % Math.max(16, 40 - score / 15) === 0) spawnStone();

    stones.forEach(s => {
      s.y += s.vy;
      s.angle += s.spin;

      // Score increases when a stone passes safely
      if (!s.counted && s.y > rocket.y + rocket.h) {
        s.counted = true;
        score += 1;
      }
    });

    stones = stones.filter(s => s.y < H + 60);

    for (const s of stones) {
      if (circleHitsRocket(s)) {
        alive = false;
        best = Math.max(best, score);
        break;
      }
    }
  }

  x.fillStyle = '#101828';
  x.fillRect(0, 0, W, H);

  x.fillStyle = '#233247';
  stars.forEach(s => {
    s.y += s.s;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    x.fillRect(s.x, s.y, 2, 2);
  });

  stones.forEach(drawStone);
  drawRocket();

  x.fillStyle = '#e6f1ff';
  x.font = '16px monospace';
  x.fillText('SCORE ' + score, 12, 24);
  x.fillText('BEST ' + best, W - 92, 24);

  if (!alive) {
    x.fillStyle = '#0b0f1acc';
    x.fillRect(0, 0, W, H);
    x.fillStyle = '#ffd166';
    x.font = '24px monospace';
    x.textAlign = 'center';
    x.fillText('ROCKET DOWN!', W / 2, H / 2 - 10);
    x.font = '14px monospace';
    x.fillStyle = '#e6f1ff';
    x.fillText('PRESS SPACE TO LAUNCH AGAIN', W / 2, H / 2 + 20);
    x.textAlign = 'left';
  }

  requestAnimationFrame(loop);
}

reset();
loop();
</script>
</body>
</html>
